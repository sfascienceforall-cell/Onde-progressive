
<style>*{box-sizing:border-box;margin:0;padding:0;}body{background:#fff;font-family:system-ui,-apple-system,sans-serif;}</style>

<div style="width:100%;height:55vh;min-height:280px;position:relative;border-radius:12px;overflow:hidden;margin-bottom:12px;background:#fff;border:1.5px solid #e8e8e8;">
  <canvas id="cv" style="position:absolute;top:0;left:0;width:100%;height:100%;display:block;"></canvas>
</div>

<div id="fml" style="font-size:13px;padding:10px 16px;border-radius:20px;background:#f5f5f5;border:1.5px solid #d0d0d0;color:#2c2c2a;margin:0 0 10px;font-family:ui-monospace,monospace;line-height:1.8;display:block;width:100%;">
  f(x, t) = A · sin(kx − ωt) &nbsp;|&nbsp; le profil avance, la matière oscille sur place
</div>

<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
  <span style="min-width:120px;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;">Amplitude A</span>
  <input type="range" id="amp" min="10" max="70" value="38" step="1" style="flex:1;accent-color:#378ADD;">
  <span id="ampv" style="min-width:52px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 12px;">38</span>
</div>
<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
  <span style="min-width:120px;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;">Fréquence f</span>
  <input type="range" id="freq" min="1" max="6" value="2" step="0.5" style="flex:1;accent-color:#378ADD;">
  <span id="freqv" style="min-width:52px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 12px;">2</span>
</div>
<div style="display:flex;align-items:center;gap:12px;margin:6px 0;">
  <span style="min-width:120px;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 16px;white-space:nowrap;">Vitesse v</span>
  <input type="range" id="spd" min="0.5" max="4" value="1.5" step="0.5" style="flex:1;accent-color:#378ADD;">
  <span id="spdv" style="min-width:52px;text-align:center;font-size:13px;font-weight:500;color:#2c2c2a;background:#f5f5f5;border:1.5px solid #d0d0d0;border-radius:20px;padding:6px 12px;">1.5</span>
</div>

<div style="display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap;">
  <button id="btn-p" onclick="togglePause()" style="padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #185fa5;background:#e6f1fb;color:#185fa5;">Pause</button>
  <button onclick="t=0;" style="padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #f09595;background:#fcebeb;color:#a32d2d;">Recommencer</button>
</div>

<script>
const cv=document.getElementById('cv');
let paused=false,t=0,W=0,H=0;
const sl={amp:document.getElementById('amp'),freq:document.getElementById('freq'),spd:document.getElementById('spd')};
const ov={amp:document.getElementById('ampv'),freq:document.getElementById('freqv'),spd:document.getElementById('spdv')};
Object.keys(sl).forEach(k=>sl[k].addEventListener('input',()=>{ov[k].textContent=sl[k].value;}));
function togglePause(){paused=!paused;const b=document.getElementById('btn-p');if(paused){b.textContent='Reprendre';b.style.cssText='padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #f09595;background:#fcebeb;color:#a32d2d;';}else{b.textContent='Pause';b.style.cssText='padding:8px 20px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid #185fa5;background:#e6f1fb;color:#185fa5;';}}

// position fixe du point tracé (35% de la largeur)
const TRACED_FRAC = 0.35;

function frame(){
  const rect=cv.parentElement.getBoundingClientRect();
  W=Math.round(rect.width)||700; H=Math.round(rect.height)||300;
  cv.width=W; cv.height=H;
  const A=parseFloat(sl.amp.value);
  const f=parseFloat(sl.freq.value);
  const v=parseFloat(sl.spd.value);
  const k=f*2*Math.PI/W;
  const omega=k*v*60;
  if(!paused) t+=1/60;
  const ctx=cv.getContext('2d');
  const cy=H/2;

  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);

  // axe horizontal central (tirets)
  ctx.strokeStyle='rgba(0,0,0,0.12)'; ctx.lineWidth=0.8; ctx.setLineDash([4,6]);
  ctx.beginPath(); ctx.moveTo(0,cy); ctx.lineTo(W,cy); ctx.stroke(); ctx.setLineDash([]);

  // onde de référence t=0 (tiretée orange)
  ctx.beginPath(); ctx.strokeStyle='#D85A3055'; ctx.lineWidth=1.5; ctx.setLineDash([4,5]);
  for(let x=0;x<=W;x++){const y=cy-A*Math.sin(k*x); x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke(); ctx.setLineDash([]);

  // onde mobile bleue
  ctx.beginPath(); ctx.strokeStyle='#378ADD'; ctx.lineWidth=2.5;
  for(let x=0;x<=W;x++){const y=cy-A*Math.sin(k*x-omega*t); x===0?ctx.moveTo(x,y):ctx.lineTo(x,y);}
  ctx.stroke();

  // particules bleues
  const n=Math.floor(W/28);
  for(let i=0;i<=n;i++){
    const x=i/n*W; const y=cy-A*Math.sin(k*x-omega*t);
    ctx.beginPath(); ctx.arc(x,y,3,0,Math.PI*2);
    ctx.fillStyle='#185fa5aa'; ctx.fill();
  }

  // --- POINT ROUGE TRACÉ ---
  const tracedX = TRACED_FRAC * W;
  const tracedY = cy - A*Math.sin(k*tracedX - omega*t);

  // axe vertical tirets du point (de cy-A-15 à cy+A+15)
  ctx.strokeStyle='#E24B4A88'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(tracedX, cy-A-18); ctx.lineTo(tracedX, cy+A+18); ctx.stroke();
  ctx.setLineDash([]);

  // axe horizontal tirets du point (de son niveau jusqu'à l'axe)
  ctx.strokeStyle='#E24B4A88'; ctx.lineWidth=1; ctx.setLineDash([3,4]);
  ctx.beginPath(); ctx.moveTo(0, tracedY); ctx.lineTo(tracedX-6, tracedY); ctx.stroke();
  ctx.setLineDash([]);

  // flèche vitesse instantanée du point
  const dy = A*omega*Math.cos(k*tracedX - omega*t);
  const sign = dy > 0 ? -1 : 1;
  const arrowLen = 16;
  ctx.beginPath(); ctx.strokeStyle='#E24B4A'; ctx.lineWidth=1.8;
  ctx.moveTo(tracedX, tracedY); ctx.lineTo(tracedX, tracedY+sign*arrowLen); ctx.stroke();
  ctx.beginPath(); ctx.fillStyle='#E24B4A';
  const ay=tracedY+sign*arrowLen;
  ctx.moveTo(tracedX, ay+sign*7); ctx.lineTo(tracedX-4, ay); ctx.lineTo(tracedX+4, ay); ctx.closePath(); ctx.fill();

  // point rouge
  ctx.beginPath(); ctx.arc(tracedX, tracedY, 7, 0, Math.PI*2);
  ctx.fillStyle='#E24B4A'; ctx.fill();
  ctx.beginPath(); ctx.arc(tracedX, tracedY, 7, 0, Math.PI*2);
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5; ctx.stroke();

  // lambda bracket
  const lPx=2*Math.PI/k;
  const p0=(Math.PI/2+omega*t)/k%lPx;
  const px0=p0<0?p0+lPx:p0; const px1=px0+lPx;
  if(px1<W&&px0>0){
    const by=cy-A-26;
    ctx.strokeStyle='#BA7517'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(px0,by+5); ctx.lineTo(px0,by); ctx.lineTo(px1,by); ctx.lineTo(px1,by+5); ctx.stroke();
    ctx.fillStyle='#BA7517'; ctx.font='13px system-ui,sans-serif'; ctx.textAlign='center';
    ctx.fillText('λ',(px0+px1)/2,by-5);
  }

  // flèche propagation
  ctx.beginPath(); ctx.strokeStyle='#378ADD'; ctx.lineWidth=1.5;
  ctx.moveTo(W-90,18); ctx.lineTo(W-34,18); ctx.stroke();
  ctx.beginPath(); ctx.fillStyle='#378ADD';
  ctx.moveTo(W-26,18); ctx.lineTo(W-36,13); ctx.lineTo(W-36,23); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#378ADD'; ctx.font='12px system-ui,sans-serif'; ctx.textAlign='right';
  ctx.fillText('v →', W-92, 16);

  // légende point rouge
  ctx.fillStyle='#E24B4A'; ctx.font='11px system-ui,sans-serif'; ctx.textAlign='left';
  ctx.fillText('● oscille ↕ sur place', tracedX+12, tracedY > cy ? tracedY-10 : tracedY+18);

  requestAnimationFrame(frame);
}
frame();
</script>
